server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincore}
    username: ${DB_USER:fincore}
    password: ${DB_PASSWORD:fincore_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET:local-dev-only-change-this-secret-32bytes-minimum}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
