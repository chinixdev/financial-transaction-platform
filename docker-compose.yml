services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore_dev
    ports:
      - "5432:5432"
    volumes:
      - fincore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fincore
      DB_USER: fincore
      DB_PASSWORD: fincore_dev
      JWT_SECRET: local-dev-only-change-this-secret-32bytes-minimum
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  fincore_pg:
